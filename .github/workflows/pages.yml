# Publishes the implementation Kanban board.
#
# The board is the one artefact this repository can show a visitor: 51 tickets
# across 8 phases, with 46 of them Parked under ADR-0005. It makes the
# bounded-slice decision visible as a shape rather than as a claim in prose.
#
# Just the board. The specifications, services, tests and tooling are not
# published: the board is a single self-contained file, and shipping the rest
# would put a second copy of the contracts at a URL that no gate keeps in step
# with specs/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - auth-separation_implementation-kanban_v1.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deployment; let it finish and queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the Kanban board
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The board is a single self-contained file (generated by
      # portfolio-kanban-generator: no framework, no CDN, no vendored files), so
      # the site is just that one file served as index.html.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp auth-separation_implementation-kanban_v1.html _site/index.html

      # A published board that renders zero cards has shipped before elsewhere in
      # this portfolio. Assert the payload is present and carries every ticket
      # before deploying, so an empty shell fails here rather than going live.
      - name: The published copy carries the board
        run: |
          grep -q 'id="payload-tickets"' _site/index.html
          grep -q '"id":"AUTH-001"' _site/index.html
          echo "payload present"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 30
