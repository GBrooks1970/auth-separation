# Publishes the implementation Kanban board.
#
# The board is the one artefact this repository can show a visitor: 51 tickets
# across 8 phases, with 46 of them Parked under ADR-0005. It makes the
# bounded-slice decision visible as a shape rather than as a claim in prose.
#
# Runtime files only. The specifications, services, tests and tooling are not
# published: the board is self-contained, and shipping the rest would put a
# second copy of the contracts at a URL that no gate keeps in step with specs/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - auth-separation_implementation-kanban_v1.html
      - vendor/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deployment; let it finish and queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the Kanban board
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # AS-02 vendored React, ReactDOM and Babel so the board opens from disk
      # with no network at all. The published copy must keep that property, so
      # vendor/ ships with it and nothing is fetched from a CDN.
      - name: Assemble the site
        run: |
          mkdir -p _site/vendor
          cp auth-separation_implementation-kanban_v1.html _site/index.html
          cp vendor/*.js _site/vendor/
          cp vendor/README.md _site/vendor/ 2>/dev/null || true

      # A published board that renders zero cards has shipped before elsewhere in
      # this portfolio. Assert the payload is present and carries every ticket
      # before deploying, so an empty shell fails here rather than going live.
      - name: The published copy carries the board
        run: |
          grep -q 'id="payload-tickets"' _site/index.html
          grep -q '"id":"AUTH-001"' _site/index.html
          test -s _site/vendor/react-18.2.0.production.min.js
          test -s _site/vendor/react-dom-18.2.0.production.min.js
          test -s _site/vendor/babel-standalone-7.23.9.min.js
          echo "payload and vendored runtime present"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 30
