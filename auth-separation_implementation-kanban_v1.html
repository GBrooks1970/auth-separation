<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth Separation &mdash; Implementation Kanban v1</title>
  <!--
    Vendored locally (AS-02) so the board opens with no network. These are the
    same versions previously loaded from cdnjs, taken from the published npm
    packages; see vendor/README.md. Do not repoint these at a CDN: this file is
    the plan of record for all 51 tickets and must render offline.
  -->
  <script src="vendor/react-18.2.0.production.min.js"></script>
  <script src="vendor/react-dom-18.2.0.production.min.js"></script>
  <script src="vendor/babel-standalone-7.23.9.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #1f3864;
      --p0: #dc2626; --p0-bg: #fee2e2;
      --p1: #ea580c; --p1-bg: #ffedd5;
      --p2: #2563eb; --p2-bg: #dbeafe;
      --p3: #6b7280; --p3-bg: #f3f4f6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    header { background: var(--accent); color: #fff; padding: 14px 24px; }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    header p { margin: 4px 0 0 0; font-size: 12px; opacity: 0.85; }
    .stats { display: flex; gap: 16px; padding: 12px 24px; background: #fff;
             border-bottom: 1px solid var(--border); flex-wrap: wrap; font-size: 12px; }
    .stat { display: flex; align-items: center; gap: 6px; }
    .stat .num { font-weight: 700; font-size: 16px; color: var(--accent); }
    .stat .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px; }
    .filters { padding: 10px 24px; background: #fff; border-bottom: 1px solid var(--border);
               display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12px; }
    .filters label { color: var(--muted); margin-right: 4px; }
    .filters select, .filters input { padding: 4px 8px; border: 1px solid var(--border);
                                       border-radius: 4px; font-size: 12px; background: #fff; }
    .board { display: flex; gap: 12px; padding: 16px 24px; overflow-x: auto; min-height: calc(100vh - 200px); }
    .column { flex: 1; min-width: 240px; max-width: 320px; background: #f1f5f9; border-radius: 8px;
              border: 1px solid var(--border); display: flex; flex-direction: column; }
    .column-head { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex;
                   justify-content: space-between; align-items: center; }
    .column-head .name { font-weight: 600; font-size: 13px; }
    .column-head .count { background: var(--accent); color: #fff; font-size: 11px;
                          padding: 1px 8px; border-radius: 10px; font-weight: 600; }
    .column-body { padding: 8px; flex: 1; overflow-y: auto; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 10px;
            margin-bottom: 8px; cursor: pointer; transition: all 0.15s; border-left-width: 4px; }
    .card:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.08); transform: translateY(-1px); }
    .card-id { font-family: 'SF Mono', Consolas, monospace; font-size: 10px; color: var(--muted);
               font-weight: 600; }
    .card-title { font-size: 13px; font-weight: 600; margin: 4px 0 6px 0; line-height: 1.3; }
    .card-feature { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .tag { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
           text-transform: uppercase; letter-spacing: 0.04em; }
    .tag-p0 { background: var(--p0-bg); color: var(--p0); }
    .tag-p1 { background: var(--p1-bg); color: var(--p1); }
    .tag-p2 { background: var(--p2-bg); color: var(--p2); }
    .tag-p3 { background: var(--p3-bg); color: var(--p3); }
    .tag-type { background: #e0e7ff; color: #3730a3; }
    .tag-phase { background: #f0fdf4; color: #166534; }
    .tag-blocked { background: #fef3c7; color: #92400e; }
    .card-deps { font-size: 10px; color: var(--muted); margin-top: 6px; }
    .border-p0 { border-left-color: var(--p0); }
    .border-p1 { border-left-color: var(--p1); }
    .border-p2 { border-left-color: var(--p2); }
    .border-p3 { border-left-color: var(--p3); }
    .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: flex;
                align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal { background: #fff; border-radius: 8px; max-width: 800px; width: 100%; max-height: 90vh;
             overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
    .modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex;
                  justify-content: space-between; align-items: flex-start; gap: 12px; }
    .modal-body { padding: 20px; font-size: 13px; line-height: 1.6; }
    .modal-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
                     color: var(--muted); margin: 16px 0 6px 0; font-weight: 600; }
    .modal-body p { margin: 4px 0 12px 0; }
    .modal-body ul { margin: 4px 0 12px 0; padding-left: 20px; }
    .modal-body li { margin: 4px 0; }
    .modal-body code { background: #f1f5f9; padding: 1px 5px; border-radius: 3px;
                       font-size: 0.9em; font-family: 'SF Mono', Consolas, monospace; }
    .close-btn { background: transparent; border: 1px solid var(--border); color: var(--muted);
                 padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .close-btn:hover { background: #f1f5f9; }
    .dep-pill { display: inline-block; background: #f1f5f9; border: 1px solid var(--border);
                font-family: 'SF Mono', Consolas, monospace; font-size: 11px; padding: 2px 6px;
                border-radius: 3px; margin: 2px 4px 2px 0; }
    .dep-pill-met { background: #dcfce7; border-color: #86efac; color: #166534; }
    .dep-pill-unmet { background: #fef3c7; border-color: #fcd34d; color: #92400e; }
    .legend { padding: 10px 24px; background: #fff; border-top: 1px solid var(--border);
              font-size: 11px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .swatch { width: 12px; height: 12px; border-radius: 2px; }
  </style>
</head>

erence: auth-separation_database-spec_v1.md sections 2.6, 3.7, 5.6.","status":"Backlog","blocks":["AUTH-083"]},{"id":"AUTH-083","title":"Security review and sign-off","feature":"Production launch","phase":7,"type":"Compliance","priority":"P0","assignee":"Security engineering","description":"Walk through every conformance checklist (README, three compliance docs, deployment topology, database spec) and capture sign-off.","blockedBy":["AUTH-070","AUTH-071","AUTH-072","AUTH-075","AUTH-082"],"acceptance":["Each conformance item has an evidence reference","Outstanding gaps tracked with owners","Sign-off recorded by security committee"],"spec":"Reference: every '_v1.md' conformance checklist in this folder.","status":"Backlog","blocks":["AUTH-084"]},{"id":"AUTH-084","title":"Production launch and smoke tests","feature":"Production launch","phase":7,"type":"Feature","priority":"P0","assignee":"All teams","description":"Cut over to production, run smoke tests, monitor for first 48 hours.","blockedBy":["AUTH-083"],"acceptance":["Smoke suite passes in production","On-call rotation active","Dashboards green for 48-hour soak","Postmortem of launch published"],"spec":"Reference: auth-separation_README_v1.md production-readiness checklist (10 items).","status":"Backlog","blocks":[]}]</script>
  <script id="payload-stats" type="application/json">{"total":51,"byStatus":{"Backlog":46,"Ready":3,"Done":2},"byPhase":{"0":6,"1":7,"2":4,"3":15,"4":4,"5":4,"6":6,"7":5},"byPriority":{"P0":36,"P1":13,"P2":2},"byType":{"Foundation":2,"Infrastructure":10,"Feature":24,"Compliance":9,"Test":6},"generatedAt":"2026-08-16 00:15:58Z","version":"1.2"}</script>
  <script type="text/babel">
    const { useState, useMemo } = React;
    const TICKETS = JSON.parse(document.getElementById("payload-tickets").textContent);
    const STATS   = JSON.parse(document.getElementById("payload-stats").textContent);
    const COLUMNS = ["Backlog", "Ready", "In Progress", "In Review", "Done"];
    const PRIORITY_ORDER = { "P0": 0, "P1": 1, "P2": 2, "P3": 3 };

    function priClass(p) { return "tag-" + p.toLowerCase(); }
    function borderClass(p) { return "border-" + p.toLowerCase(); }

    function depMet(ticketId, allTickets) {
      const t = allTickets.find(x => x.id === ticketId);
      if (!t) return false;
      return t.status === "Done";
    }

    function Card({ ticket, onClick, allTickets }) {
      const unmetDeps = ticket.blockedBy.filter(d => !depMet(d, allTickets));
      return (
        <div className={`card ${borderClass(ticket.priority)}`} onClick={() => onClick(ticket)}>
          <div className="card-id">{ticket.id}</div>
          <div className="card-title">{ticket.title}</div>
          <div className="card-feature">{ticket.feature} &middot; Phase {ticket.phase}</div>
          <div className="card-tags">
            <span className={`tag ${priClass(ticket.priority)}`}>{ticket.priority}</span>
            <span className="tag tag-type">{ticket.type}</span>
            {unmetDeps.length > 0 && (
              <span className="tag tag-blocked">Blocked: {unmetDeps.length}</span>
            )}
          </div>
          {ticket.blockedBy.length > 0 && (
            <div className="card-deps">Blocked by: {ticket.blockedBy.join(", ")}</div>
          )}
        </div>
      );
    }

    function Modal({ ticket, onClose, allTickets }) {
      if (!ticket) return null;
      return (
        <div className="modal-bg" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <div className="card-id">{ticket.id} &middot; Phase {ticket.phase}</div>
                <div style={{fontSize: 18, fontWeight: 700, marginTop: 4}}>{ticket.title}</div>
                <div style={{display: "flex", gap: 6, marginTop: 8}}>
                  <span className={`tag ${priClass(ticket.priority)}`}>{ticket.priority}</span>
                  <span className="tag tag-type">{ticket.type}</span>
                  <span className="tag tag-phase">Phase {ticket.phase}</span>
                </div>
              </div>
              <button className="close-btn" onClick={onClose}>Close</button>
            </div>
            <div className="modal-body">
              <h3>Feature</h3>
              <p>{ticket.feature}</p>
              <h3>Description</h3>
              <p>{ticket.description}</p>
              <h3>Assignee</h3>
              <p>{ticket.assignee}</p>
              <h3>Status</h3>
              <p>{ticket.status}</p>
              <h3>Acceptance Criteria</h3>
              <ul>{ticket.acceptance.map((a, i) => <li key={i}>{a}</li>)}</ul>
              <h3>Spec / Implementation Notes</h3>
              <p>{ticket.spec}</p>
              <h3>Blocked By ({ticket.blockedBy.length})</h3>
              <div>
                {ticket.blockedBy.length === 0 ? <em>No dependencies</em> :
                  ticket.blockedBy.map(d => {
                    const dep = allTickets.find(x => x.id === d);
                    const met = dep && dep.status === "Done";
                    return (
                      <span key={d} className={`dep-pill ${met ? "dep-pill-met" : "dep-pill-unmet"}`}
                            title={dep ? dep.title : ""}>
                        {d}{dep ? " - " + dep.title : ""}
                      </span>
                    );
                  })
                }
              </div>
              <h3>Blocks ({ticket.blocks.length})</h3>
              <div>
                {ticket.blocks.length === 0 ? <em>Blocks nothing downstream</em> :
                  ticket.blocks.map(d => {
                    const dep = allTickets.find(x => x.id === d);
                    return (
                      <span key={d} className="dep-pill" title={dep ? dep.title : ""}>
                        {d}{dep ? " - " + dep.title : ""}
                      </span>
                    );
                  })
                }
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Board() {
      const [openTicket, setOpenTicket] = useState(null);
      const [phaseFilter, setPhaseFilter] = useState("all");
      const [priorityFilter, setPriorityFilter] = useState("all");
      const [typeFilter, setTypeFilter] = useState("all");
      const [searchText, setSearchText] = useState("");

      const filtered = useMemo(() => {
        const s = searchText.trim().toLowerCase();
        return TICKETS.filter(t => {
          if (phaseFilter !== "all" && String(t.phase) !== phaseFilter) return false;
          if (priorityFilter !== "all" && t.priority !== priorityFilter) return false;
          if (typeFilter !== "all" && t.type !== typeFilter) return false;
          if (s && !(t.id.toLowerCase().includes(s) || t.title.toLowerCase().includes(s)
                  || t.feature.toLowerCase().includes(s))) return false;
          return true;
        });
      }, [phaseFilter, priorityFilter, typeFilter, searchText]);

      const byColumn = useMemo(() => {
        const out = {};
        for (const c of COLUMNS) out[c] = [];
        for (const t of filtered) out[t.status].push(t);
        for (const c of COLUMNS) {
          out[c].sort((a, b) => {
            const p = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
            if (p !== 0) return p;
            return a.id.localeCompare(b.id);
          });
        }
        return out;
      }, [filtered]);

      const phases = [...new Set(TICKETS.map(t => t.phase))].sort((a, b) => a - b);
      const types = [...new Set(TICKETS.map(t => t.type))].sort();

      return (
        <div>
          <header>
            <h1>Auth Separation &mdash; Implementation Kanban v1</h1>
            <p>Phased plan to fully implement the auth-separation spec set. {STATS.total} tickets across {phases.length} phases.</p>
          </header>
          <div className="stats">
            <div className="stat"><span className="num">{STATS.total}</span><span className="lbl">Total</span></div>
            {COLUMNS.map(c => (
              <div className="stat" key={c}>
                <span className="num">{STATS.byStatus[c] || 0}</span>
                <span className="lbl">{c}</span>
              </div>
            ))}
            <div className="stat"><span className="num">{STATS.byPriority.P0 || 0}</span><span className="lbl">P0</span></div>
            <div className="stat"><span className="num">{STATS.byPriority.P1 || 0}</span><span className="lbl">P1</span></div>
            <div className="stat" style={{marginLeft: "auto", color: "var(--muted)"}}>
              <span className="lbl">v{STATS.version} &middot; {STATS.generatedAt}</span>
            </div>
          </div>
          <div className="filters">
            <label>Phase:</label>
            <select value={phaseFilter} onChange={e => setPhaseFilter(e.target.value)}>
              <option value="all">All phases</option>
              {phases.map(p => <option key={p} value={p}>Phase {p}</option>)}
            </select>
            <label>Priority:</label>
            <select value={priorityFilter} onChange={e => setPriorityFilter(e.target.value)}>
              <option value="all">All priorities</option>
              <option value="P0">P0 - Critical</option>
              <option value="P1">P1 - High</option>
              <option value="P2">P2 - Medium</option>
              <option value="P3">P3 - Low</option>
            </select>
            <label>Type:</label>
            <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)}>
              <option value="all">All types</option>
              {types.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
            <label>Search:</label>
            <input type="text" placeholder="ID, title, feature..." value={searchText}
                   onChange={e => setSearchText(e.target.value)} style={{minWidth: 200}} />
            <span style={{marginLeft: "auto", color: "var(--muted)"}}>
              {filtered.length} of {TICKETS.length} shown
            </span>
          </div>
          <div className="board">
            {COLUMNS.map(col => (
              <div className="column" key={col}>
                <div className="column-head">
                  <span className="name">{col}</span>
                  <span className="count">{byColumn[col].length}</span>
                </div>
                <div className="column-body">
                  {byColumn[col].map(t => (
                    <Card key={t.id} ticket={t} onClick={setOpenTicket} allTickets={TICKETS} />
                  ))}
                </div>
              </div>
            ))}
          </div>
          <div className="legend">
            <span><strong>Priority:</strong></span>
            <span className="legend-item"><span className="swatch" style={{background: "var(--p0)"}}></span>P0 (blocker)</span>
            <span className="legend-item"><span className="swatch" style={{background: "var(--p1)"}}></span>P1 (high)</span>
            <span className="legend-item"><span className="swatch" style={{background: "var(--p2)"}}></span>P2 (medium)</span>
            <span className="legend-item"><span className="swatch" style={{background: "var(--p3)"}}></span>P3 (low)</span>
            <span style={{marginLeft: 16}}><strong>Click any card</strong> for full spec, acceptance criteria, and dependency graph.</span>
          </div>
          <Modal ticket={openTicket} onClose={() => setOpenTicket(null)} allTickets={TICKETS} />
        </div>
      );
    }
    ReactDOM.render(<Board />, document.getElementById("root"));
  </script>
</body>
